name: Python License Check

on:
  push:

permissions:
  contents: read
  id-token: write

jobs:
  license-check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::904233131484:role/CvecCodeArtifactInternalReadOnlyAccess
          aws-region: us-east-1

      - name: Configure CodeArtifact
        run: |
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain cvector --domain-owner 904233131484 --region us-east-1 --query authorizationToken --output text)
          echo "::add-mask::$CODEARTIFACT_AUTH_TOKEN"
          echo "UV_INDEX_CVECTOR_INTERNAL_USERNAME=aws" >> "$GITHUB_ENV"
          echo "UV_INDEX_CVECTOR_INTERNAL_PASSWORD=${CODEARTIFACT_AUTH_TOKEN}" >> "$GITHUB_ENV"

      - name: Check Python licenses
        uses: CVector-Energy/pyproject-license-check@d56c86ec80d397b5de30e3915e217c50112da00b # v0.5.1
        with:
          app-id: ${{ vars.APP_ID }}
          app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # A project with no third-party runtime dependencies has no licenses to check, and LicenseCheck reports that as exit code 3, which the action fails on by default. Accepting it hides nothing: a dependency that cannot be resolved is still listed, with no license, and fails with exit code 1 — as does an incompatible license. Exit code 3 only ever means the project declares no dependencies at all.
          allow-no-packages: true
          # Source-aware license resolution (editable projects, private indexes, exact artifacts) is still unreleased, and the `allowed-license-references` and `license-overrides` inputs below depend on it. Move back to a tagged LicenseCheck release once the pull request lands.
          licensecheck-version: git+https://github.com/FHPythonUtils/LicenseCheck.git@3d26581de610b08a44e697d7d5bb1ee6af6639a2 # LicenseCheck#151
          allowed-license-references: LicenseRef-NVIDIA-Proprietary LicenseRef-NVIDIA-SOFTWARE-LICENSE
          license-overrides: |
            # Public Domain/BSD; the wheel excludes the GPL-covered Emacs mode.
            "docutils==0.22.4" = "BSD-2-Clause"
            # BSD-3-Clause; the wheel publishes the full license text without an SPDX identifier.
            "us==3.2.0" = "BSD-3-Clause"
            # NVIDIA CUDA Toolkit EULA; reviewed at 13.0.3.0.
            "cuda-toolkit==13.0.3.0" = "LicenseRef-NVIDIA-Proprietary"
            # NVIDIA CUDA Toolkit EULA; reviewed at 0.8.1.
            "nvidia-cusparselt-cu13==0.8.1" = "LicenseRef-NVIDIA-Proprietary"
            # PSF-2.0 (Python Software Foundation License); the wheel metadata has no SPDX identifier. Windows-only certbot dependency.
            "pywin32==312" = "PSF-2.0"
            # Apache-2.0; 1.7.5 publishes no CPython 3.14 wheel, so the audit resolves the private-index sdist and cannot read wheel metadata.
            "cvxpy==1.7.5" = "Apache-2.0"

name: CI

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - uv.lock
      - pyproject.toml
      - src/**
      - tests/**
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - uv.lock
      - pyproject.toml
      - src/**
      - tests/**

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: CVector-Energy/python-test@d223d8bc5764691c1c87f9609eddad67519d44bd # v2.0.1
        with:
          python-version: ${{ matrix.python-version }}
          src-dirs: .
